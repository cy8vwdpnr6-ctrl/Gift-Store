<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
button { padding: 15px 30px; font-size: 18px; background: #0098EA; color: white; border: none; border-radius: 10px; margin-top: 20px; }
#result { margin-top: 20px; font-size: 14px; color: #ccc; white-space: pre-wrap; text-align: left; padding: 10px; }
</style>
</head>
<body>
  <h1>کد جدید لود شد!</h1>
  <p>اگر این متن رو می‌بینی، یعنی کش تلگرام پاک شده و کد جدید کار می‌کنه.</p>
  
  <button onclick="testAPI()">تست اتصال به سرور</button>
  
  <div id="result"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if(tg){tg.ready();tg.expand();}

  async function testAPI() {
    const resDiv = document.getElementById('result');
    resDiv.innerText = "در حال اتصال به سرور...";
    
    try {
      const response = await fetch('https://gift-store-production.up.railway.app/api/gifts');
      const data = await response.json();
      
      if (data.status === "success") {
        resDiv.innerText = `✅ اتصال موفق!\n\nتعداد گیفت‌های دریافتی: ${data.data.length}\n\nاولین گیفت:\n${JSON.stringify(data.data[0], null, 2)}`;
      } else {
        resDiv.innerText = "❌ سرور جواب داد ولی ارور داشت: " + JSON.stringify(data);
      }
    } catch (e) {
      resDiv.innerText = "❌ خطا در اتصال به سرور: " + e.message;
    }
  }
</script>
</body>
</html>
